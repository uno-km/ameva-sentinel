name: "AMEVA-Sentinel"
package_name_pypi: ""
package_name_npm: "@ameva/sentinel"
version: "v0.6.0-alpha.1"
release_name: "Target Discrimination & Trust Boundary Alpha"
license: "Apache-2.0"
platform: "Browser DOM / NodeNext ESM"
github_repo_url: "https://github.com/uno-km/ameva-sentinel"

tagline_en: "Privacy-first Security Observability, Target Discrimination & Deterministic Threat Scoring Layer for Web Applications"
tagline_ko: "개인정보 침해 없는 대상 선별(Target Discrimination), 봇 분류 및 확정적 위험도 채점 보안 레이어"

quick_install_cmd: "npm install @ameva/sentinel@alpha @ameva/sentinel-browser@alpha @ameva/sentinel-risk-core@alpha"

why_challenge_en: "Traditional bot mitigation SDKs aggressively collect unhashed keystrokes, absolute mouse coordinates, and intrusive canvas hashes, resulting in severe GDPR/CCPA regulatory liabilities and unpredictable false-positive blocks."
why_challenge_ko: "기존 봇 탐지 솔루션은 키로깅, 절대 마우스 좌표, 캔버스 지문 등 침해성 높은 원시 데이터를 수집하여 심각한 개인정보 규제 리스크와 불투명한 오탐(False Positive) 차단을 유발합니다."

description_en: "AMEVA Sentinel extracts minimal derived interaction statistics with zero raw coordinate persistence. It compiles declarative policy rules into deterministic 0 to 100 risk scores, 7-tier bot taxonomy classifications, and cryptographic collector token verifications."
description_ko: "AMEVA Sentinel은 원시 입력값을 일절 저장하지 않고 최소 파생 통계만을 수집합니다. 선언적 정책 엔진을 통해 0~100점의 확정적 점수, 7대 봇 분류 체계, sv1 암호화 수집기 검증을 제공합니다."

features:
  - title_en: "Target Discrimination (HUMANS / BOTS / PARTNERS)"
    title_ko: "트래픽 대상 선별 제어 (HUMANS / BOTS / PARTNERS)"
    desc_en: "Declarative target traffic modes allowing services to enforce humans-only, bots-only, or verified-partners-only policies."
    desc_ko: "서비스 목적에 맞춰 인간 전용, 봇 전용, 검증된 파트너 전용 정책을 선언적으로 설정하고 자동 라우팅합니다."
  - title_en: "7-Tier Smart Bot Classifier & ReDoS Safety"
    title_ko: "7대 스마트 봇 분류기 및 ReDoS 안전성"
    desc_en: "Zero-ReDoS linear regex taxonomy classifying search engines, AI agents, social previews, monitoring, and scrapers."
    desc_ko: "검색엔진, AI 에이전트, 소셜 미리보기, 모니터링, 스크래퍼 등을 ReDoS 위험 없는 선형 정규식으로 정밀 분류합니다."
  - title_en: "Cryptographic Trust Boundary Collector (sv1)"
    title_ko: "sv1 암호화 신뢰 경계 수집기 및 리플레이 방어"
    desc_en: "Canonical JSON subset, HMAC-SHA256 signatures, multi-tenant nonce stores, and unforgeable opaque verified contexts."
    desc_ko: "표준 정규화 JSON, HMAC-SHA256 서명, 멀티테넌트 논스 관리로 위조 불가능한 신뢰 컨텍스트를 보장합니다."
  - title_en: "Closed-Destination URL Routing & Open Redirect Defense"
    title_ko: "폐쇄형 목적지 라우팅 및 오픈 리다이렉트 방어"
    desc_en: "Strictly validated closed destination unions and constructor-time registry guards eliminating open redirect vulnerabilities."
    desc_ko: "엄격히 검증된 폐쇄형 목적지 ID와 생성자 시점 레지스트리 검증으로 오픈 리다이렉트 취약점을 원천 차단합니다."

matrix_table:
  - category: "Client Telemetry Subsystem"
    operations: "Throttled pointermove (100ms), Discrete Click/Touch Observation, Hardware Webdriver Detection"
    status: "Verified (Chromium, Firefox, WebKit)"
  - category: "Risk Core & Decision Engine"
    operations: "Target Discrimination Truth Table, 7-Tier Bot Classifier, Deterministic Rule Scoring"
    status: "Verified (100% Quality Gates)"
  - category: "Trust Boundary & Collector Crypto"
    operations: "sv1 Envelope, NIST SHA-256 / RFC 4231 HMAC, Multi-Tenant Nonce Store, 100-Race Defense"
    status: "Verified (Fail-Closed)"
  - category: "Stateful Enforcement"
    operations: "Fixed-Window Session Burst Limiter, LocalStorage Deduplicated Event Store (V1 & V2)"
    status: "Verified (Idempotent v2.0)"

code_example_py: |
  import { createBrowserTelemetry } from '@ameva/sentinel-browser';
  import {
    createSentinel,
    StaticKeyResolver,
    MemoryNonceStore,
    MemoryFixedWindowCounterStore,
    LocalStorageRiskEventStore
  } from '@ameva/sentinel';

  // 1. Collect privacy-safe derived interaction signals
  const telemetry = createBrowserTelemetry({ autoStart: true });
  const signals = telemetry.snapshot();

  // 2. Initialize Sentinel instance with Trust Boundary & Target Mode
  const sentinel = createSentinel({
    mode: 'shadow',
    keyResolver: new StaticKeyResolver({ 'prod-key-1': process.env.COLLECTOR_SECRET }),
    nonceStore: new MemoryNonceStore(),
    expectedAudience: 'sentinel-api-prod',
    expectedPurpose: 'telemetry-collect',
    counterStore: new MemoryFixedWindowCounterStore(),
    eventStore: new LocalStorageRiskEventStore()
  });

  const report = await sentinel.score({
    headers: {
      'user-agent': navigator.userAgent,
      'authorization': 'Bearer sv1.ey...sig'
    },
    signals
  });
