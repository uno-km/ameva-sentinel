[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ameva-sentinel"
version = "2.2.0"
description = "Deterministic Cost-Aware Policy Guardrails and Risk Observation SDK for Python"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [
    { name = "AMEVA Engineering Team" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7,<3",
    "typing-extensions>=4.6.0",
]

[project.optional-dependencies]
redis = [
    "redis>=5.0.0,<6.0.0",
]
fastapi = [
    "fastapi>=0.110.0,<1.0.0",
    "starlette>=0.36.0,<1.0.0",
]
flask = [
    "flask>=2.3.0,<4.0.0",
]
sqlalchemy = [
    "sqlalchemy>=2.0.0,<3.0.0",
]
yaml = [
    "pyyaml>=6.0.1,<7.0.0",
]
all = [
    "redis>=5.0.0,<6.0.0",
    "fastapi>=0.110.0,<1.0.0",
    "starlette>=0.36.0,<1.0.0",
    "flask>=2.3.0,<4.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "pyyaml>=6.0.1,<7.0.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "fastapi>=0.110.0",
    "flask>=2.3.0",
    "sqlalchemy>=2.0.0",
    "pyyaml>=6.0.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ameva_sentinel" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "strict"
filterwarnings = [
    "ignore:.*Using .*httpx.* with .*starlette.*",
    "ignore:.*starlette\\.testclient.*",
]







