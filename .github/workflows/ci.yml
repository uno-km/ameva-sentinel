name: AMEVA Sentinel CI Quality Gate

on:
  push:
    branches:
      - main
      - 'release-*'
  pull_request:
    branches:
      - main
      - 'release-*'
  workflow_dispatch:

jobs:
  verify:
    name: Verify 86 Quality Gates & Packaging
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser binaries
        run: npx playwright install --with-deps

      - name: Compile and build monorepo packages
        run: npm run build

      - name: Execute TypeScript contract tests
        run: npm run test:types

      - name: Execute unit and integration tests
        run: npm run test:unit

      - name: Execute Playwright cross-browser test suite
        run: npx playwright test

      - name: Run Fail-Closed Release Verification & Export Pipeline
        run: npm run verify:release

      - name: Upload Verification Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-test-reports-${{ github.sha }}
          path: |
            reports/TEST_SUITE_AND_RESULTS.md
            reports/TEST_SUITE_AND_RESULTS.txt
            reports/summary.json
            reports/provenance.json
            scripts/codes/TEST_SUITE_AND_RESULTS.md
            scripts/codes/TEST_SUITE_AND_RESULTS.txt
            scripts/codes/summary.json
            scripts/codes/provenance.json
            scripts/codes/source_export.txt
