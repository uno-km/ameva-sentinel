name: Publish to npm & GitHub Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dist_tag:
        description: 'Explicit npm dist-tag (leave empty to auto-detect from package version)'
        required: false
        default: ''

jobs:
  publish-npm:
    name: Publish Packages to Public npm Registry
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install Clean Dependencies (npm ci)
        run: npm ci

      - name: Install Playwright Browsers with OS Dependencies
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run Full Quality Gate Verification
        run: npm run verify

      - name: Determine Target Dist-Tag
        id: tag_eval
        run: |
          VERSION=$(node -p "require('./packages/sentinel/package.json').version")
          if [ -n "${{ github.event.inputs.dist_tag }}" ]; then
            TAG="${{ github.event.inputs.dist_tag }}"
          elif [[ "$VERSION" == *"-alpha."* || "$VERSION" == *"-alpha"* ]]; then
            TAG="alpha"
          elif [[ "$VERSION" == *"-beta."* || "$VERSION" == *"-beta"* ]]; then
            TAG="beta"
          elif [[ "$VERSION" == *"-rc."* || "$VERSION" == *"-rc"* ]]; then
            TAG="next"
          else
            TAG="latest"
          fi
          echo "DIST_TAG=$TAG" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Determined Version: $VERSION, Target Dist-Tag: $TAG"

      - name: Publish @ameva/sentinel-risk-core
        run: |
          DIST_TAG="${{ steps.tag_eval.outputs.DIST_TAG }}"
          VERSION=$(node -p "require('./packages/risk-core/package.json').version")
          if npm view "@ameva/sentinel-risk-core@$VERSION" version >/dev/null 2>&1; then
            echo "Version $VERSION already exists. Ensuring dist-tag $DIST_TAG..."
            npm dist-tag add "@ameva/sentinel-risk-core@$VERSION" "$DIST_TAG" || true
          else
            npm publish --workspace @ameva/sentinel-risk-core --access public --tag "$DIST_TAG"
          fi
          if [ "$DIST_TAG" != "latest" ]; then
            CURRENT_LATEST=$(npm view @ameva/sentinel-risk-core dist-tags.latest 2>/dev/null || true)
            if [ "$CURRENT_LATEST" = "$VERSION" ]; then
              echo "Removing premature latest dist-tag for pre-release $VERSION..."
              npm dist-tag rm "@ameva/sentinel-risk-core" latest || true
            fi
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @ameva/sentinel-browser
        run: |
          DIST_TAG="${{ steps.tag_eval.outputs.DIST_TAG }}"
          VERSION=$(node -p "require('./packages/browser-sdk/package.json').version")
          if npm view "@ameva/sentinel-browser@$VERSION" version >/dev/null 2>&1; then
            echo "Version $VERSION already exists. Ensuring dist-tag $DIST_TAG..."
            npm dist-tag add "@ameva/sentinel-browser@$VERSION" "$DIST_TAG" || true
          else
            npm publish --workspace @ameva/sentinel-browser --access public --tag "$DIST_TAG"
          fi
          if [ "$DIST_TAG" != "latest" ]; then
            CURRENT_LATEST=$(npm view @ameva/sentinel-browser dist-tags.latest 2>/dev/null || true)
            if [ "$CURRENT_LATEST" = "$VERSION" ]; then
              echo "Removing premature latest dist-tag for pre-release $VERSION..."
              npm dist-tag rm "@ameva/sentinel-browser" latest || true
            fi
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @ameva/sentinel
        run: |
          DIST_TAG="${{ steps.tag_eval.outputs.DIST_TAG }}"
          VERSION=$(node -p "require('./packages/sentinel/package.json').version")
          if npm view "@ameva/sentinel@$VERSION" version >/dev/null 2>&1; then
            echo "Version $VERSION already exists. Ensuring dist-tag $DIST_TAG..."
            npm dist-tag add "@ameva/sentinel@$VERSION" "$DIST_TAG" || true
          else
            npm publish --workspace @ameva/sentinel --access public --tag "$DIST_TAG"
          fi
          if [ "$DIST_TAG" != "latest" ]; then
            CURRENT_LATEST=$(npm view @ameva/sentinel dist-tags.latest 2>/dev/null || true)
            if [ "$CURRENT_LATEST" = "$VERSION" ]; then
              echo "Removing premature latest dist-tag for pre-release $VERSION..."
              npm dist-tag rm "@ameva/sentinel" latest || true
            fi
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-github-packages:
    name: Publish Packages to GitHub Packages Registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
          scope: '@uno-km'

      - name: Install Clean Dependencies (npm ci)
        run: npm ci

      - name: Build All Workspaces
        run: npm run build

      - name: Publish Scoped Packages to GitHub Packages Registry
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" > ~/.npmrc
          echo "@uno-km:registry=https://npm.pkg.github.com" >> ~/.npmrc

          for pkg_dir in packages/risk-core packages/browser-sdk packages/sentinel; do
            if [ -d "$pkg_dir" ]; then
              echo "Publishing $pkg_dir to GitHub Packages..."
              node -e '
                const fs = require("fs");
                const p = "./'$pkg_dir'/package.json";
                const pkg = JSON.parse(fs.readFileSync(p, "utf8"));
                pkg.name = pkg.name.replace("@ameva/", "@uno-km/");
                pkg.publishConfig = { registry: "https://npm.pkg.github.com" };
                pkg.repository = "https://github.com/uno-km/ameva-sentinel";
                fs.writeFileSync(p, JSON.stringify(pkg, null, 2));
              '
              (cd "$pkg_dir" && npm publish --registry=https://npm.pkg.github.com) || echo "GitHub package publish skipped or already exists"
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
