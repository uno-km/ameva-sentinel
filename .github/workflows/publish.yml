name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dist_tag:
        description: 'Explicit npm dist-tag (leave empty to auto-detect from package version)'
        required: false
        default: ''

jobs:
  publish:
    name: Publish Packages to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install Clean Dependencies (npm ci)
        run: npm ci

      - name: Install Playwright Browsers with OS Dependencies
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run Full Quality Gate Verification
        run: npm run verify

      - name: Determine Target Dist-Tag
        id: tag_eval
        run: |
          VERSION=$(node -p "require('./packages/sentinel/package.json').version")
          if [ -n "${{ github.event.inputs.dist_tag }}" ]; then
            TAG="${{ github.event.inputs.dist_tag }}"
          elif [[ "$VERSION" == *"-alpha."* || "$VERSION" == *"-alpha"* ]]; then
            TAG="alpha"
          elif [[ "$VERSION" == *"-beta."* || "$VERSION" == *"-beta"* ]]; then
            TAG="beta"
          elif [[ "$VERSION" == *"-rc."* || "$VERSION" == *"-rc"* ]]; then
            TAG="next"
          else
            TAG="latest"
          fi
          echo "DIST_TAG=$TAG" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Determined Version: $VERSION, Target Dist-Tag: $TAG"

      - name: Publish @ameva/sentinel-risk-core
        run: |
          DIST_TAG="${{ steps.tag_eval.outputs.DIST_TAG }}"
          VERSION=$(node -p "require('./packages/risk-core/package.json').version")
          if npm view "@ameva/sentinel-risk-core@$VERSION" version >/dev/null 2>&1; then
            echo "Version $VERSION already exists. Ensuring dist-tag $DIST_TAG..."
            npm dist-tag add "@ameva/sentinel-risk-core@$VERSION" "$DIST_TAG" || true
          else
            npm publish --workspace @ameva/sentinel-risk-core --access public --tag "$DIST_TAG"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @ameva/sentinel-browser
        run: |
          DIST_TAG="${{ steps.tag_eval.outputs.DIST_TAG }}"
          VERSION=$(node -p "require('./packages/browser-sdk/package.json').version")
          if npm view "@ameva/sentinel-browser@$VERSION" version >/dev/null 2>&1; then
            echo "Version $VERSION already exists. Ensuring dist-tag $DIST_TAG..."
            npm dist-tag add "@ameva/sentinel-browser@$VERSION" "$DIST_TAG" || true
          else
            npm publish --workspace @ameva/sentinel-browser --access public --tag "$DIST_TAG"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @ameva/sentinel
        run: |
          DIST_TAG="${{ steps.tag_eval.outputs.DIST_TAG }}"
          VERSION=$(node -p "require('./packages/sentinel/package.json').version")
          if npm view "@ameva/sentinel@$VERSION" version >/dev/null 2>&1; then
            echo "Version $VERSION already exists. Ensuring dist-tag $DIST_TAG..."
            npm dist-tag add "@ameva/sentinel@$VERSION" "$DIST_TAG" || true
          else
            npm publish --workspace @ameva/sentinel --access public --tag "$DIST_TAG"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
