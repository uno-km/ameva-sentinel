name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dist_tag:
        description: 'npm dist-tag (e.g. alpha, latest)'
        required: true
        default: 'alpha'

jobs:
  publish:
    name: Publish Packages to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install Clean Dependencies (npm ci)
        run: npm ci

      - name: Install Playwright Browsers with OS Dependencies
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run Full Quality Gate Verification
        run: npm run verify

      - name: Determine npm dist-tag
        id: tag_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "DIST_TAG=${{ github.event.inputs.dist_tag }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref_name }}" == *"-alpha"* ]]; then
            echo "DIST_TAG=alpha" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref_name }}" == *"-beta"* ]]; then
            echo "DIST_TAG=beta" >> $GITHUB_OUTPUT
          else
            echo "DIST_TAG=latest" >> $GITHUB_OUTPUT
          fi

      - name: Publish @ameva/sentinel-risk-core
        run: |
          VERSION=$(node -p "require('./packages/risk-core/package.json').version")
          if npm view @ameva/sentinel-risk-core@$VERSION version >/dev/null 2>&1; then
            echo "Version $VERSION of @ameva/sentinel-risk-core is already published. Skipping."
          else
            npm publish --workspace @ameva/sentinel-risk-core --access public --tag ${{ steps.tag_info.outputs.DIST_TAG }}
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @ameva/sentinel-browser
        run: |
          VERSION=$(node -p "require('./packages/browser-sdk/package.json').version")
          if npm view @ameva/sentinel-browser@$VERSION version >/dev/null 2>&1; then
            echo "Version $VERSION of @ameva/sentinel-browser is already published. Skipping."
          else
            npm publish --workspace @ameva/sentinel-browser --access public --tag ${{ steps.tag_info.outputs.DIST_TAG }}
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @ameva/sentinel
        run: |
          VERSION=$(node -p "require('./packages/sentinel/package.json').version")
          if npm view @ameva/sentinel@$VERSION version >/dev/null 2>&1; then
            echo "Version $VERSION of @ameva/sentinel is already published. Skipping."
          else
            npm publish --workspace @ameva/sentinel --access public --tag ${{ steps.tag_info.outputs.DIST_TAG }}
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
